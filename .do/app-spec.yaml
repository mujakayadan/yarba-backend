alerts:
- rule: DEPLOYMENT_FAILED
- rule: DOMAIN_FAILED
features:
- buildpack-stack=ubuntu-22
ingress:
  rules:
  - component:
      name: yarba-backend
    match:
      path:
        prefix: /
name: yarba-app
region: sfo
services:
- environment_slug: python
  github:
    branch: master
    deploy_on_push: true
    repo: mucahitkayadan/yarba-backend
  http_port: 8000
  instance_count: 1
  instance_size_slug: apps-s-1vcpu-0.5gb
  name: yarba-backend
  build_command: pip install poetry==1.7.1 && poetry config virtualenvs.create false && poetry install --no-dev
  run_command: python api.py
  source_dir: /
  envs:
  - key: PORT
    value: "8000"
  - key: PYTHONPATH
    value: "/"
