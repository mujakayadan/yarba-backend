alerts:
- rule: DEPLOYMENT_FAILED
- rule: DOMAIN_FAILED
ingress:
  rules:
  - component:
      name: yarba-backend
    match:
      path:
        prefix: /
name: yarba-app
region: sfo
services:
- github:
    branch: master
    deploy_on_push: true
    repo: mucahitkayadan/yarba-backend
  http_port: 8000
  instance_count: 1
  instance_size_slug: apps-s-1vcpu-0.5gb
  name: yarba-backend
  dockerfile_path: Dockerfile
  source_dir: /
