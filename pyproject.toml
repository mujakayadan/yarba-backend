[tool.poetry]
name = "resume_builder"
version = "0.1.0"
description = "A LaTeX-based resume builder with AI assistance"
authors = ["Muja Kayadan <mujakayadan@gmail.com>"]
# Make readme optional or remove if not needed in the Docker image
readme = "README.md"
packages = [
    {include = "api", from = "."},
    {include = "core", from = "."},
    {include = "config", from = "."},
    {include = "ui", from = "."},
    {include = "scripts", from = "."},
]
# Add package mode configuration
package-mode = false

[tool.poetry.dependencies]
python = ">=3.10,<3.14"
streamlit = "^1.32.0"
beanie = "^1.25.0"
motor = "^3.3.2"
pydantic = "^2.6.3"
pydantic-settings = "^2.2.1"
litellm = "^1.63.14"
aiohttp = "^3.9.1"
uvicorn = "^0.30.1"
fastapi = "^0.115.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
app = "main:main"
lint = "scripts.lint:run_flake8"
format = "scripts.format:run_formatters"

[tool.poetry.group.dev.dependencies]
black = "^24.2.0"
isort = "^5.13.2"
mypy = "^1.8.0"
pytest = "^8.0.0"
pytest-asyncio = "^0.23.5"
pytest-cov = "^4.1.0"
ruff = "^0.2.2"
flake8 = "^7.1.2"
flake8-docstrings = "^1.7.0"
flake8-quotes = "^3.4.0"
flake8-bugbear = "^24.12.12"
flake8-comprehensions = "^3.16.0"
flake8-black = "^0.3.6"
pre-commit = "^4.2.0"
bcrypt = "4.0.1"
mongomock-motor = "^0.0.35"

[tool.black]
line-length = 88
target-version = ["py313"]

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
asyncio_mode = "auto"

[tool.ruff]
line-length = 88
target-version = "py313"
select = ["E", "F", "B", "I"]
ignore = []
