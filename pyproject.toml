[tool.poetry]
name = "yarba"
version = "0.1.0"
description = "YARBA: Yet Another Resume Builder App. A LaTeX-based resume builder with AI assistance"
authors = ["Muja Kayadan <mujakayadan@gmail.com>"]
# Make readme optional or remove if not needed in the Docker image
readme = "README.md"
packages = [
    {include = "api", from = "."},
    {include = "core", from = "."},
    {include = "config", from = "."},
    {include = "scripts", from = "."}
]
# Add package mode configuration
package-mode = false

[tool.poetry.dependencies]
python = ">=3.12,<3.13"
beanie = "^1.29.0"
motor = "^3.7.0"
pydantic = "^2.11.4"
pydantic-settings = "^2.8.1"
litellm = "^1.63.14"
aiohttp = "^3.11.16"
uvicorn = {extras = ["standard"], version = "^0.34.0"}
fastapi = "^0.115.12"
python-jose = {extras = ["cryptography"], version = "^3.4.0"}
python-multipart = "^0.0.20"
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
email-validator = "^2.2.0"
firebase-admin = "^6.7.0"
pillow = "^10.4.0"
boto3 = "^1.37.31"
cryptography = "^44.0.2"
selenium = "^4.31.0"
webdriver-manager = "^4.0.2"
psutil = "^7.0.0"
requests = "^2.31.0"
json-repair = "^0.41.1"
jinja2 = "^3.1.3"
h11 = "0.16.0"
python-dotenv = "^1.1.0"
pdfminer-six = "^20221105"
python-docx = "^1.1.2"
playwright = ">=1.52.0,<2.0.0"
typing-extensions = ">=4.13.0,<5.0.0"
beautifulsoup4 = "^4.12.3"
markdownify = "^0.11.6"
crawl4ai = "0.6.3"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
app = "main:main"
lint = "scripts.lint:run_ruff_check"
format = "scripts.format:run_formatters"

[tool.poetry.group.dev.dependencies]
black = "^25.1.0"
isort = "^5.13.2"
mypy = "^1.8.0"
pytest = "^8.0.0"
pytest-asyncio = "^0.23.5"
pytest-cov = "^4.1.0"
ruff = "^0.2.2"
flake8 = "^7.1.2"
flake8-docstrings = "^1.7.0"
flake8-quotes = "^3.4.0"
flake8-bugbear = "^24.12.12"
flake8-comprehensions = "^3.16.0"
flake8-black = "^0.3.6"
pre-commit = "^4.2.0"
bcrypt = "4.0.1"
mongomock-motor = "^0.0.35"
autoflake = "^2.3.0"

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
asyncio_mode = "auto"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "B", "I"]
ignore = []
