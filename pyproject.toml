[project]
name = "yarba"
version = "0.1.0"
description = "YARBA: Yet Another Resume Builder App. A LaTeX-based resume builder with AI assistance"
readme = "README.md"
requires-python = ">=3.12,<3.14"
authors = [{ name = "Muja Kayadan", email = "mujakayadan@gmail.com" }]
license = "Elastic-2.0"
dependencies = [
    "beanie>=2.0.0,<3.0.0",
    "pymongo>=4.10.0,<5.0.0",
    "pydantic>=2.11.4,<3.0.0",
    "pydantic-settings>=2.14.2,<3.0.0",
    "litellm>=1.89.0,<1.90.0",
    "aiohttp>=3.14.1,<4.0.0",
    "uvicorn[standard]>=0.52.1,<0.53.0",
    "fastapi>=0.141.1,<0.142.0",
    "starlette>=1.0.1,<2.0.0",
    "pyjwt[crypto]>=2.10.0,<3.0.0",
    "python-multipart>=0.0.32,<0.1.0",
    "pwdlib[bcrypt]>=0.3.0,<0.4.0",
    "email-validator>=2.2.0,<3.0.0",
    "firebase-admin>=7.0.0,<8.0.0",
    "pillow>=12.2.0,<13.0.0",
    "boto3>=1.43.67,<2.0.0",
    "cryptography>=50.0.0,<51.0.0",
    "psutil>=7.0.0,<8.0.0",
    "requests>=2.31.0,<3.0.0",
    "json-repair>=0.60.1,<0.61.0",
    "jinja2>=3.1.3,<4.0.0",
    "h11==0.16.0",
    "python-dotenv>=1.1.0,<2.0.0",
    "pdfminer-six>=20221105",
    "python-docx>=1.1.2,<2.0.0",
    "playwright>=1.62.0,<2.0.0",
    "typing-extensions>=4.13.0,<5.0.0",
    "beautifulsoup4>=4.15.0,<5.0.0",
    "markdownify>=1.2.2,<1.3.0",
    "crawl4ai>=0.9.0,<0.10.0",
]

[dependency-groups]
dev = [
    "mypy>=2.1.0,<3.0.0",
    "pytest>=9.1.1,<10.0.0",
    "pytest-asyncio>=0.31.0",
    "pytest-cov>=7.0.0,<8.0.0",
    "ruff>=0.15.16,<0.16.0",
    "pre-commit>=4.2.0,<5.0.0",
    "mongomock>=4.2.0,<5.0.0",
    "vulture>=2.16",
]

[tool.uv]
package = false
# Crawl4AI's LiteLLM fork installs the same `litellm` modules as the official
# package, so exclude the fork to prevent a mixed, unimportable installation.
exclude-dependencies = ["unclecode-litellm"]
override-dependencies = [
    "starlette>=1.0.1,<2.0.0",
    "lxml>=6.1.0",
    "litellm>=1.89.0,<1.90.0",
]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
explicit_package_bases = true
mypy_path = ["."]
packages = ["api", "config", "core", "scripts", "utils"]
exclude = ["core/database/migrations/", "core/easy_applier/"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
asyncio_mode = "auto"
addopts = "--strict-markers -v"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "api: marks tests as API tests",
    "asyncio: marks tests as asyncio tests",
]
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    ".eggs",
    ".tox",
    ".venv",
    "venv",
    "env",
    "my_data",
]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "Q",
    "UP",
    "ARG",
]
ignore = [
    "E203",
    "E501",
    "B008",
    "B904",
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"api.py" = ["E402"]
"api/main.py" = ["E402"]
"api/test_api.py" = ["E402"]
"scripts/**" = ["E402", "ARG002"]
"tests/**" = ["E402", "ARG001", "ARG002"]
"core/database/migrations/**" = ["E402"]

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true

[tool.vulture]
paths = ["api", "core", "config", "scripts", "utils"]
exclude = ["tests/", "core/database/migrations/", "**/__pycache__"]
min_confidence = 80
