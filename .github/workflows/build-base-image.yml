name: Build base image

on:
  push:
    branches: [main]
    paths:
      - Dockerfile.base
      - pyproject.toml
      - uv.lock
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-base:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.base
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/yarba-backend-base:latest
            ghcr.io/${{ github.repository_owner }}/yarba-backend-base:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
