name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy

      - name: Pytest
        env:
          ENVIRONMENT: test
          MONGODB_URI: mongodb://localhost:27017
          MONGODB_DATABASE: test_db
          JWT_SECRET_KEY: test_secret_key_for_jwt_signing_32chars
        run: uv run pytest
